name: Deploy edge function

# Run by hand (Actions > Deploy edge function > Run workflow), from the GitHub site or app, so a function can be
# redeployed without a computer. Needs the repository secret SUPABASE_ACCESS_TOKEN (a personal access token from
# supabase.com/dashboard/account/tokens).

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy (a folder under supabase/functions)'
        required: true
        default: 'analysis-run'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTION: ${{ inputs.function }}
        run: |
          case "$FUNCTION" in */*|.*|_*|'') echo "bad function name"; exit 1;; esac
          test -d "supabase/functions/$FUNCTION" || { echo "no such function: $FUNCTION"; exit 1; }
          supabase functions deploy "$FUNCTION" --project-ref ugfrglbcoivkprjqvjzz --use-api
