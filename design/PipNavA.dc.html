<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:78px;background:#0e1013;border-top:2px solid rgba(233,237,242,.12);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:14px">
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;{{ sBox }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ sInk }}" stroke-width="1.9" stroke-linecap="round"><path d="M3 12h4l2-5 3 10 2.5-7 1.5 4h5"/></svg><span style="font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:{{ sInk }}">STATUS</span></div>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;{{ mBox }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ mInk }}" stroke-width="1.9" stroke-linecap="round"><path d="M12 21s6.5-6.3 6.5-11a6.5 6.5 0 1 0-13 0C5.5 14.7 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg><span style="font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:{{ mInk }}">MAP</span></div>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;{{ lBox }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ lInk }}" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span style="font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:{{ lInk }}">LOG</span></div>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;{{ xBox }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{ xInk }}" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span style="font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:{{ xInk }}">SETUP</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:78},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;status&quot;,&quot;map&quot;,&quot;log&quot;,&quot;setup&quot;],&quot;default&quot;:&quot;status&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const on = "border-top:3px solid #ffb02e;margin-top:-2px;background:rgba(255,176,46,.08)";
    const a = this.props.active || "status";
    const k = ["status","map","log","setup"], p = ["s","m","l","x"], out = {};
    k.forEach((key, i) => {
      out[p[i] + "Box"] = a === key ? on : "";
      out[p[i] + "Ink"] = a === key ? "#ffb02e" : "rgba(233,237,242,.7)";
    });
    return out;
  }
}
</script>
</body>
</html>
