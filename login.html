<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAVIDE // BIOSCAN — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0a0a14; --panel:#12101e; --line:#2e2850; --line-bright:#4a3f7a;
    --cyan:#4cf1ff; --magenta:#ff4cd6; --text:#eef0fb; --muted:#6e6a94; --muted-2:#9d97c4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'Rajdhani', sans-serif; font-weight:500; }
  body{ display:flex; align-items:center; justify-content:center; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .login-card{
    width:min(360px, 90vw); background:var(--panel); border:1px solid var(--line-bright);
    border-radius:20px; padding:36px 28px; text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,0.5), 0 0 50px rgba(76,241,255,0.06);
  }
  .login-title{
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.1em;
    color:var(--cyan); text-shadow:0 0 10px rgba(76,241,255,0.5); margin-bottom:6px;
  }
  .login-sub{ font-size:13px; color:var(--muted-2); margin-bottom:28px; }

  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:13px; background:var(--text); color:#1a1a2e;
    border:none; border-radius:100px; font-family:'Rajdhani', sans-serif; font-weight:600;
    font-size:15px; cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .google-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 20px rgba(76,241,255,0.25); }
  .google-btn svg{ width:18px; height:18px; }

  .status{
    margin-top:18px; font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--muted); min-height:16px;
  }
  .status.error{ color:var(--magenta); }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-title mono">DAVIDE // BIOSCAN</div>
  <div class="login-sub">Sign in to view your dashboard</div>

  <button class="google-btn" id="google-signin">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Sign in with Google
  </button>

  <div class="status mono" id="status"></div>
</div>

<script>
  // Real Supabase project — bioscan-dashboard, ap-southeast-1
  const SUPABASE_URL = 'https://ugfrglbcoivkprjqvjzz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_GyandyvuVbF0RxZLnugz4A_GlNIstPc';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl = document.getElementById('status');

  // If already signed in, skip straight to the dashboard rather than showing
  // the login screen again.
  sb.auth.getSession().then(({ data }) => {
    if(data.session){
      window.location.href = './index.html';
    }
  });

  document.getElementById('google-signin').addEventListener('click', async () => {
    statusEl.textContent = 'Redirecting to Google...';
    statusEl.classList.remove('error');
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'index.html'),
        // drive.readonly (added for GPX route files linked in calendar events,
        // hosted on Drive and not publicly shared) is broader than calendar.readonly
        // — it can read any file in Drive, not just this one. Needed because
        // drive.file only grants access to files the app itself creates/opens
        // via a picker, not arbitrary existing files reached by a known link.
        scopes: 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/drive.readonly',
        // Google doesn't return a refresh token by default — access_type:'offline'
        // plus prompt:'consent' forces one, per Supabase's own documented
        // workaround. Without this, session.provider_token (Google's own
        // Calendar API token, distinct from the Supabase session token) expires
        // in ~1h and a normal Supabase session refresh does NOT refresh it —
        // only a fresh login does, which is a real, still-open rough edge.
        queryParams: { access_type: 'offline', prompt: 'consent' }
      }
    });
    if(error){
      statusEl.textContent = 'Error: ' + error.message;
      statusEl.classList.add('error');
    }
  });
</script>

</body>
</html>
