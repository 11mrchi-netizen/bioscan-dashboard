name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'console/**'
      - 'design/tokens/**'
      - 'index.html'
      - '.github/workflows/deploy-console.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: Build
        working-directory: console
        env:
          # Public by design (same values as index.html and the Android app; RLS is the real gate). They were read from
          # repository secrets that never existed (the repo only has SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY), so every
          # deployed build showed "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY".
          VITE_SUPABASE_URL: https://ugfrglbcoivkprjqvjzz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_GyandyvuVbF0RxZLnugz4A_GlNIstPc
        run: npm run build

      # One app (web redesign, Nov 2026): the site root serves the build, so Today is the landing page. The hashed chunks stay in
      # console/assets (the root page points into that folder); console/index.html is only a stub that carries the old
      # /console/#/... links, hash included, to the root.
      - name: Stage built files into console/ and the site root
        run: |
          rm -rf console/assets
          cp -r console/dist/assets console/assets
          # The public files (logo mark, favicon, touch icon, icon sprite) sit beside index.html at the site root, where the page
          # and the menu ask for them; they were never copied before, so the logo 404ed on the live site.
          for f in favicon.svg icons.svg mark.svg apple-touch-icon.png; do cp "console/dist/$f" "$f"; done
          sed -e 's#"\./assets/#"./console/assets/#g' console/dist/app.html > index.html
          grep -q 'console/assets/app-' index.html
          cat > console/index.html <<'STUB'
          <!doctype html>
          <meta charset="utf-8"><title>Field Terminal</title>
          <script>location.replace('../' + location.hash)</script>
          <p>This page moved to <a href="../">the app</a>.</p>
          STUB

      - name: Commit and push built console
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg icons.svg mark.svg apple-touch-icon.png console/index.html console/assets
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: deploy console build [skip ci]"
          git push
