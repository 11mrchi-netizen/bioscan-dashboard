name: Test analysis core

on:
  push:
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/zepp-extract/*.ts'
      - 'console/src/lib/**'
      - 'docs/analysis-layer-2/02-metric-registry.md'
      - '.github/workflows/test-core.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/zepp-extract/*.ts'
      - 'console/src/lib/**'
      - 'docs/analysis-layer-2/02-metric-registry.md'
      - '.github/workflows/test-core.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 strips TypeScript types natively; the core is written in erasable TypeScript so
      # the same files run here, in Deno (Edge Functions) and in Vite (console).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Analysis core tests
        run: node --test "supabase/functions/_shared/analysis-core/*.test.ts"

      - name: Log-agent core tests
        run: node --test "supabase/functions/_shared/log-core/*.test.ts"

      - name: Agent core tests and golden set
        run: node --test "supabase/functions/_shared/agent-core/*.test.ts"

      - name: Zepp extraction decoder tests
        run: node --test "supabase/functions/zepp-extract/*.test.ts"

      - name: Body composition tests
        run: node --test "supabase/functions/_shared/body-composition/*.test.ts"

      - name: Console schema tests
        run: node --test "console/src/lib/*.test.ts"
